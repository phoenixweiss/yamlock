name: Website CI

on:
  pull_request:
    paths:
      - "VERSION"
      - "website/**"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "VERSION"
      - "website/**"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Quality and browser budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Verify Yarn Classic
        shell: bash
        run: |
          expected_version="$(
            node -p "require('./package.json').packageManager.replace(/^yarn@/, '')"
          )"
          actual_version="$(yarn --version)"

          if [[ "$actual_version" != "$expected_version" ]]; then
            printf 'Expected Yarn %s, found %s.\n' \
              "$expected_version" \
              "$actual_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check website
        run: yarn run check

      - name: Check browser behavior
        run: yarn run test:browser

      - name: Check Lighthouse budgets
        shell: bash
        run: |
          set -euo pipefail

          chrome_path="$(
            command -v google-chrome ||
              command -v google-chrome-stable ||
              true
          )"

          if [[ -z "$chrome_path" ]]; then
            printf 'Google Chrome is not available on the runner.\n' >&2
            exit 1
          fi

          CHROME_PATH="$chrome_path" yarn run lighthouse

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-browser-report
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: ignore
          retention-days: 7
