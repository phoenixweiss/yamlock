name: Website deployment

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to deploy (v1.0.0 or newer)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build release website
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              inputs.release_tag
            }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Validate published release
        id: release
        shell: bash
        env:
          AUTOMATIC_DEPLOY: ${{ github.event_name == 'workflow_run' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || '' }}
          RELEASE_TAG: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_branch ||
              inputs.release_tag
            }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
        working-directory: .
        run: |
          set -euo pipefail

          if [[ "$AUTOMATIC_DEPLOY" == "true" && "$WORKFLOW_EVENT" != "push" ]]; then
            printf 'Automatic deployment requires a completed tag push workflow.\n' >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Expected a stable release tag v1.0.0 or newer.\n' >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          node scripts/release-check.js --tag "$RELEASE_TAG"

          release_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"

          if [[ "$tag_commit" != "$release_commit" ]]; then
            printf 'Release tag %s does not point to checked out commit %s.\n' \
              "$RELEASE_TAG" \
              "$release_commit" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_COMMIT" && "$RELEASE_COMMIT" != "$release_commit" ]]; then
            printf 'Release workflow commit %s does not match checked out commit %s.\n' \
              "$RELEASE_COMMIT" \
              "$release_commit" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          main_commit="$(git rev-parse refs/remotes/origin/main)"

          if [[ "$release_commit" != "$main_commit" ]]; then
            printf 'Release commit %s does not match origin/main %s.\n' \
              "$release_commit" \
              "$main_commit" >&2
            exit 1
          fi

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/pages-release.json"

          latest_release_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/latest" \
              --jq '.id'
          )"

          jq -e \
            --arg commit "$release_commit" \
            --argjson latest_id "$latest_release_id" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$version" \
            '
              .id == $latest_id and
              .draft == false and
              .prerelease == false and
              .tag_name == $tag and
              .target_commitish == $commit and
              .name == ("yamlock " + $version) and
              (.body | length) > 0 and
              (.assets | length) == 0
            ' \
            "$RUNNER_TEMP/pages-release.json" >/dev/null

          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$release_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Yarn Classic
        shell: bash
        run: |
          expected_version="$(
            node -p "require('./package.json').packageManager.replace(/^yarn@/, '')"
          )"
          actual_version="$(yarn --version)"

          if [[ "$actual_version" != "$expected_version" ]]; then
            printf 'Expected Yarn %s, found %s.\n' \
              "$expected_version" \
              "$actual_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check website
        shell: bash
        run: |
          set -euo pipefail

          chrome_path="$(
            command -v google-chrome ||
              command -v google-chrome-stable ||
              true
          )"

          if [[ -z "$chrome_path" ]]; then
            printf 'Google Chrome is not available on the runner.\n' >&2
            exit 1
          fi

          CHROME_PATH="$chrome_path" yarn run check:full

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
