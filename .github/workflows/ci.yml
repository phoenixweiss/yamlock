name: CI

on:
  push:
    branches: [dev, main]
    tags: ['v*.*.*']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YARN_VERSION: 1.22.22

jobs:
  quality:
    name: Quality (Node 22, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Use Yarn Classic
        run: npm install --global "yarn@$YARN_VERSION"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify Yarn version
        run: test "$(yarn --version)" = "$YARN_VERSION"
      - name: Lint
        run: yarn lint
      - name: Check documentation
        run: yarn check:docs
      - name: Check release metadata
        run: yarn check:release
      - name: Test with coverage thresholds
        run: yarn test:coverage
      - name: Check TypeScript declarations
        run: yarn test:types
      - name: Build and test installed package
        run: yarn test:package

  compatibility:
    name: Compatibility (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
        exclude:
          - os: ubuntu-latest
            node: '22'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Use Yarn Classic
        run: npm install --global "yarn@$YARN_VERSION"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify Yarn version
        run: test "$(yarn --version)" = "$YARN_VERSION"
      - name: Test
        run: yarn test

  release-package:
    name: Release package preflight
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Use Yarn Classic
        run: npm install --global "yarn@$YARN_VERSION"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify release tag
        run: yarn check:release --tag "$GITHUB_REF_NAME"
      - name: Build and test installed package
        run: yarn test:package
